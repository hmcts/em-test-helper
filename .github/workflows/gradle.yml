name: Java CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - refs/tags/*
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          cache: 'gradle'
          distribution: 'temurin'
      - name: Build
        run: ./gradlew check
